<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundBoard Pro</title>
    <script src="js/CSInterface.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #1a1a1a;
            color: #ddd;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            font-weight: 500;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            background: #252525;
            border-bottom: 1px solid #333;
        }

        .btn {
            background: #007acc;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .btn:hover { background: #0062a3; }
        
        .btn-tab {
            background: #333;
            color: #ccc;
            border: 1px solid #444;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-tab.active { background: #444; color: #fff; border-color: #555; }

        .search-input {
            flex: 1;
            background: #111;
            border: 1px solid #3e3e3e;
            color: #fff;
            padding: 5px 8px;
            border-radius: 3px;
            outline: none;
            font-size: 12px;
        }
        .search-input:focus { border-color: #007acc; }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .sidebar {
            width: 260px;
            min-width: 150px;
            max-width: 60%;
            background: #1e1e1e;
            border-right: 1px solid #2e2e2e;
            overflow-y: auto;
            padding: 4px;
            font-size: 12px;
        }

        .resizer {
            width: 4px;
            cursor: col-resize;
            background: #2b2b2b;
            transition: background 0.2s;
        }
        .resizer:hover { background: #007acc; }

        .content-area {
            flex: 1;
            background: #141414;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .tree-node {
            padding: 4px 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 3px;
            white-space: nowrap;
            font-size: 12px;
            font-weight: 600;
        }
        .tree-node:hover { background: #2a2a2a; }
        .tree-node.active { background: #04395e; color: #fff; }
        .tree-children { padding-left: 12px; display: none; }
        .tree-children.open { display: block; }
        .folder-count { color: #888; font-size: 11px; font-weight: normal; margin-left: 4px; }

        .file-list { flex: 1; overflow-y: auto; padding: 4px; }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            border-bottom: 1px solid #202020;
            cursor: pointer;
            border-radius: 2px;
        }
        .file-item:hover { background: #252525; }
        .file-item.selected { background: #1c3b2b; color: #73f099; }
        .file-info { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; }
        .file-name { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; font-size: 13px; font-weight: 600; }
        .duration-tag { color: #aaa; font-size: 12px; font-family: monospace; font-weight: 600; margin-right: 6px; }
        .star-btn { cursor: pointer; color: #555; font-size: 14px; margin-right: 6px; }
        .star-btn.active { color: #ffd700; }
        .action-btns { display: flex; align-items: center; gap: 6px; }

        .player-bar {
            background: #181818;
            border-top: 1px solid #2a2a2a;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .waveform-container {
            width: 100%; height: 42px; background: #0a0a0a; border: 1px solid #252525;
            position: relative; cursor: pointer; border-radius: 3px; overflow: hidden;
        }
        canvas#waveformCanvas { width: 100%; height: 100%; display: block; }
        .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background-color: #ff3b30; pointer-events: none; left: 0%; }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: #aaa;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .controls-group { display: flex; align-items: center; gap: 8px; }
        .icon-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 14px; }
        .icon-btn:hover { color: #fff; }
        .slider-control { display: flex; align-items: center; gap: 4px; }
        input[type=range] { accent-color: #888; cursor: pointer; height: 12px; }
        .time-display { font-family: monospace; font-size: 11px; color: #999; display: flex; gap: 4px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="btn" id="btnAddRoot">📁 Add Main Folder</button>
        <button class="btn-tab active" id="btnTabAll">All</button>
        <button class="btn-tab" id="btnTabFav">★ Fav</button>
        <button class="btn-tab" id="btnTabTrash">🗑 Trash Bin</button>
        <input type="text" class="search-input" id="searchInput" placeholder="Global search all roots... Type anything">
    </div>

    <input type="file" id="nativeFolderInput" webkitdirectory directory style="display:none;">

    <div class="main-container" id="mainContainer">
        <div class="sidebar" id="sidebar">
            <div id="treeContainer"></div>
        </div>
        <div class="resizer" id="resizer"></div>
        <div class="content-area">
            <div class="file-list" id="fileList">
                <div style="color:#666; padding:10px;">Select a folder or search sounds...</div>
            </div>
        </div>
    </div>

    <div class="player-bar">
        <div class="waveform-container" id="waveformContainer">
            <canvas id="waveformCanvas"></canvas>
            <div class="playhead" id="playhead"></div>
        </div>

        <div class="controls-row">
            <div class="controls-group">
                <button class="icon-btn" id="btnRestart">↺</button>
                <button class="icon-btn" id="btnPlayPause">▶</button>
                <div class="slider-control">
                    <span>🔊</span>
                    <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.8" style="width: 70px;">
                </div>
                <div class="time-display">
                    <span id="currentTime">00:00:00:00</span> /
                    <span id="totalTime">00:00:00:00</span>
                </div>
            </div>

            <div class="controls-group">
                <div>
                    <label style="cursor:pointer;"><input type="checkbox" id="chkReverse"> Reverse</label>
                </div>
                <button class="btn" id="btnAddToTimeline" style="padding: 4px 14px;">Add</button>
            </div>
        </div>
    </div>

    <audio id="audioEngine" style="display:none;"></audio>

    <script>
        const csInterface = new CSInterface();
        
        let fs, path, os;
        try {
            fs = require('fs');
            path = require('path');
            os = require('os');
        } catch(e) {
            if (window.cep && window.cep.node) {
                fs = window.cep.node.require('fs');
                path = window.cep.node.require('path');
                os = window.cep.node.require('os');
            }
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        let rootFolders = JSON.parse(localStorage.getItem('sbp_rootFolders')) || [];
        let favoritesMap = JSON.parse(localStorage.getItem('sbp_favoritesMap')) || {};
        let trashList = JSON.parse(localStorage.getItem('sbp_trashList')) || [];

        let currentActivePath = '';
        let currentTab = 'ALL';
        let isDraggingPlayhead = false;
        let animationFrameId = null;
        let activeAudioBuffer = null;
        let currentBufferSource = null;
        let isPluginFocused = false;
        let playbackStartTime = 0;
        let currentOffset = 0;
        let isPlayingWebAudio = false;
        const durationCache = {};

        const audioEngine = document.getElementById('audioEngine');
        const playPauseBtn = document.getElementById('btnPlayPause');
        const volSlider = document.getElementById('volSlider');
        const chkReverse = document.getElementById('chkReverse');
        const waveformContainer = document.getElementById('waveformContainer');
        const playhead = document.getElementById('playhead');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const canvas = document.getElementById('waveformCanvas');
        const ctx = canvas.getContext('2d');
        const fileListEl = document.getElementById('fileList');
        const treeContainer = document.getElementById('treeContainer');

        function saveStateToStorage() {
            localStorage.setItem('sbp_rootFolders', JSON.stringify(rootFolders));
            localStorage.setItem('sbp_favoritesMap', JSON.stringify(favoritesMap));
            localStorage.setItem('sbp_trashList', JSON.stringify(trashList));
        }

        window.addEventListener('focus', () => { isPluginFocused = true; });
        window.addEventListener('blur', () => { isPluginFocused = false; });
        document.body.addEventListener('click', () => { isPluginFocused = true; });

        window.addEventListener('keydown', (e) => {
            if (!isPluginFocused) return;
            if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;

            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayPause();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                stepAudio(-0.002);
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                stepAudio(0.002);
            }
        });

        function stepAudio(offset) {
            if (!audioEngine.duration && !activeAudioBuffer) return;
            if (isPlayingWebAudio) {
                currentOffset = Math.max(0, Math.min(activeAudioBuffer.duration, currentOffset + offset));
                playWebAudioBuffer(currentOffset);
            } else {
                audioEngine.currentTime = Math.max(0, Math.min(audioEngine.duration, audioEngine.currentTime + offset));
                updatePlayheadUI();
            }
        }

        function togglePlayPause() {
            if (!currentActivePath) return;

            if (isPlayingWebAudio) {
                stopWebAudio();
                playPauseBtn.innerText = '▶';
            } else if (!audioEngine.paused) {
                audioEngine.pause();
                playPauseBtn.innerText = '▶';
            } else {
                if (chkReverse.checked) {
                    playWebAudioBuffer(currentOffset);
                } else {
                    audioEngine.play();
                    startSmoothPlayheadSync();
                }
                playPauseBtn.innerText = '⏸';
            }
        }

        chkReverse.addEventListener('change', () => {
            if (currentActivePath) {
                playAudio(currentActivePath, null, 0);
            }
        });

        const sidebar = document.getElementById('sidebar');
        const resizer = document.getElementById('resizer');
        let isResizing = false;

        resizer.addEventListener('mousedown', () => { isResizing = true; });
        window.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const newWidth = e.clientX;
            if (newWidth > 120 && newWidth < window.innerWidth * 0.7) {
                sidebar.style.width = newWidth + 'px';
            }
        });
        window.addEventListener('mouseup', () => { isResizing = false; });

        document.getElementById('btnAddRoot').addEventListener('click', () => {
            try {
                if (window.cep && window.cep.fs && window.cep.fs.showOpenDialog) {
                    const res = window.cep.fs.showOpenDialog(false, true, 'Select Main Folder', '', []);
                    if (res && res.data && res.data.length > 0) {
                        addRootFolder(res.data[0]);
                        return;
                    }
                }
            } catch(e) {}
            document.getElementById('nativeFolderInput').click();
        });

        document.getElementById('nativeFolderInput').addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                const firstFile = e.target.files[0];
                if (firstFile.path && path) {
                    addRootFolder(path.dirname(firstFile.path));
                }
            }
        });

        function addRootFolder(folderPath) {
            if (!rootFolders.includes(folderPath)) {
                rootFolders.push(folderPath);
                saveStateToStorage();
                renderTree();
            }
        }

        document.getElementById('btnTabAll').addEventListener('click', (e) => { switchTab('ALL', e.target); });
        document.getElementById('btnTabFav').addEventListener('click', (e) => { switchTab('FAV', e.target); });
        document.getElementById('btnTabTrash').addEventListener('click', (e) => { switchTab('TRASH', e.target); });

        function switchTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
            el.classList.add('active');

            if (tab === 'FAV') renderFavorites();
            else if (tab === 'TRASH') renderTrash();
            else renderTree();
        }

        function getFastAudioDuration(filePath, durationSpan) {
            if (durationCache[filePath]) {
                durationSpan.innerText = durationCache[filePath];
                return;
            }

            try {
                if (!fs) return;
                const stat = fs.statSync(filePath);
                const fileSize = stat.size;
                let ext = path ? path.extname(filePath).toLowerCase() : '.wav';
                let estimatedSeconds = 0;

                if (ext === '.wav') {
                    estimatedSeconds = fileSize / (44100 * 2 * 2);
                } else if (ext === '.mp3') {
                    estimatedSeconds = (fileSize * 8) / 256000;
                } else {
                    estimatedSeconds = (fileSize * 8) / 192000;
                }

                let formatted = formatShortTime(estimatedSeconds);
                durationCache[filePath] = formatted;
                durationSpan.innerText = formatted;

                fs.readFile(filePath, (err, data) => {
                    if (err) return;
                    const arrayBuffer = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
                    audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
                        const exactTime = formatShortTime(buffer.duration);
                        durationCache[filePath] = exactTime;
                        durationSpan.innerText = exactTime;
                    }, () => {});
                });
            } catch(e) {
                durationSpan.innerText = "00:01";
            }
        }

        function formatShortTime(sec) {
            if (isNaN(sec) || !isFinite(sec) || sec <= 0) return "00:01";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function getFilesAndCountRecursive(dirPath) {
            let files = [];
            try {
                if (!fs || !path) return files;
                const items = fs.readdirSync(dirPath);
                items.forEach(item => {
                    const full = path.join(dirPath, item);
                    if (trashList.includes(full)) return;
                    
                    const stat = fs.statSync(full);
                    if (stat.isDirectory()) {
                        files = files.concat(getFilesAndCountRecursive(full));
                    } else if (/\.(mp3|wav|ogg|aac|m4a)$/i.test(item)) {
                        files.push({ name: item, path: full });
                    }
                });
            } catch(e) {}
            return files;
        }

        function renderTree() {
            treeContainer.innerHTML = '';
            rootFolders.forEach(rootPath => {
                if (fs && fs.existsSync(rootPath)) {
                    const node = createTreeNode(rootPath, true);
                    treeContainer.appendChild(node);
                }
            });
        }

        function createTreeNode(dirPath, isRoot = false) {
            const container = document.createElement('div');
            const files = getFilesAndCountRecursive(dirPath);
            const folderName = path ? path.basename(dirPath) : 'Folder';

            const row = document.createElement('div');
            row.className = 'tree-node';
            row.innerHTML = `
                <span>📁 ${folderName} <span class="folder-count">(${files.length})</span></span>
                <span class="remove-folder-btn" style="color:#666; font-size:10px;">✕</span>
            `;

            const childrenContainer = document.createElement('div');
            childrenContainer.className = 'tree-children';

            row.onclick = (e) => {
                e.stopPropagation();
                document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active'));
                row.classList.add('active');
                childrenContainer.classList.toggle('open');
                renderFileList(files);
            };

            row.querySelector('.remove-folder-btn').onclick = (e) => {
                e.stopPropagation();
                trashList.push(dirPath);
                if (isRoot) rootFolders = rootFolders.filter(r => r !== dirPath);
                saveStateToStorage();
                renderTree();
            };

            container.appendChild(row);

            try {
                if (fs && path) {
                    const subItems = fs.readdirSync(dirPath);
                    subItems.forEach(sub => {
                        const subPath = path.join(dirPath, sub);
                        if (!trashList.includes(subPath) && fs.statSync(subPath).isDirectory()) {
                            childrenContainer.appendChild(createTreeNode(subPath));
                        }
                    });
                }
            } catch(e) {}

            container.appendChild(childrenContainer);
            return container;
        }

        function renderFileList(fileArray) {
            fileListEl.innerHTML = '';
            fileArray.forEach(fileObj => {
                const isFav = !!favoritesMap[fileObj.path];
                const displayName = isFav && favoritesMap[fileObj.path].remark ? favoritesMap[fileObj.path].remark : fileObj.name;

                const card = document.createElement('div');
                card.className = 'file-item';
                card.draggable = true;

                card.innerHTML = `
                    <div class="file-info">
                        <span class="star-btn ${isFav ? 'active' : ''}">★</span>
                        <span class="file-name">${displayName}</span>
                    </div>
                    <div class="action-btns">
                        <span class="duration-tag">00:00</span>
                        <button class="btn btn-add" style="padding:2px 8px;">Add</button>
                        <span class="trash-btn" style="cursor:pointer; color:#777; margin-left:4px;">🗑</span>
                    </div>
                `;

                const durationTag = card.querySelector('.duration-tag');
                getFastAudioDuration(fileObj.path, durationTag);

                card.ondragstart = (e) => {
                    e.preventDefault();
                    if (window.cep && window.cep.fs) {
                        window.cep.fs.startDrag([fileObj.path]);
                    }
                };

                card.querySelector('.star-btn').onclick = (e) => {
                    e.stopPropagation();
                    if (favoritesMap[fileObj.path]) delete favoritesMap[fileObj.path];
                    else favoritesMap[fileObj.path] = { remark: fileObj.name };
                    saveStateToStorage();
                    if (currentTab === 'FAV') renderFavorites();
                    else renderFileList(fileArray);
                };

                card.onclick = () => playAudio(fileObj.path, card);

                card.querySelector('.btn-add').onclick = (e) => {
                    e.stopPropagation();
                    addSoundToTimeline(fileObj.path);
                };

                card.querySelector('.trash-btn').onclick = (e) => {
                    e.stopPropagation();
                    trashList.push(fileObj.path);
                    saveStateToStorage();
                    renderFileList(fileArray.filter(f => f.path !== fileObj.path));
                };

                fileListEl.appendChild(card);
            });
        }

        function renderFavorites() {
            fileListEl.innerHTML = '';
            Object.keys(favoritesMap).forEach(filePath => {
                if (trashList.includes(filePath)) return;
                const fileName = path ? path.basename(filePath) : 'Sound';
                const currentRemark = favoritesMap[filePath].remark || fileName;

                const card = document.createElement('div');
                card.className = 'file-item';
                card.innerHTML = `
                    <div class="file-info">
                        <span class="star-btn active">★</span>
                        <input type="text" value="${currentRemark}" class="search-input remark-input" style="width:140px; padding:2px;">
                    </div>
                    <div class="action-btns">
                        <button class="btn btn-add">Add</button>
                        <span class="remove-fav" style="cursor:pointer; color:#a33;">✕</span>
                    </div>
                `;

                card.querySelector('.remark-input').onchange = (e) => {
                    favoritesMap[filePath].remark = e.target.value;
                    saveStateToStorage();
                };

                card.querySelector('.remove-fav').onclick = () => {
                    delete favoritesMap[filePath];
                    saveStateToStorage();
                    renderFavorites();
                };

                card.onclick = () => playAudio(filePath, card);
                card.querySelector('.btn-add').onclick = (e) => {
                    e.stopPropagation();
                    addSoundToTimeline(filePath);
                };

                fileListEl.appendChild(card);
            });
        }

        function renderTrash() {
            fileListEl.innerHTML = '';
            trashList.forEach(itemPath => {
                const card = document.createElement('div');
                card.className = 'file-item';
                card.innerHTML = `
                    <div class="file-info">
                        <span class="file-name">${path ? path.basename(itemPath) : itemPath}</span>
                    </div>
                    <button class="btn btn-restore" style="background:#28a745;">Restore</button>
                `;

                card.querySelector('.btn-restore').onclick = () => {
                    trashList = trashList.filter(p => p !== itemPath);
                    saveStateToStorage();
                    renderTrash();
                };

                fileListEl.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (!query) return;

            let searchResults = [];
            rootFolders.forEach(root => {
                const allFiles = getFilesAndCountRecursive(root);
                searchResults = searchResults.concat(allFiles.filter(f => f.name.toLowerCase().includes(query)));
            });
            renderFileList(searchResults);
        });

        function bufferToWav(buffer) {
            let numChannels = buffer.numberOfChannels;
            let sampleRate = buffer.sampleRate;
            let format = 1;
            let bitDepth = 16;
            
            let result;
            if (numChannels === 2) {
                let left = buffer.getChannelData(0);
                let right = buffer.getChannelData(1);
                result = new Float32Array(left.length + right.length);
                for (let i = 0; i < left.length; i++) {
                    result[i * 2] = left[i];
                    result[i * 2 + 1] = right[i];
                }
            } else {
                result = buffer.getChannelData(0);
            }

            let bytesPerSample = bitDepth / 8;
            let blockAlign = numChannels * bytesPerSample;
            let bufferLength = result.length * bytesPerSample;
            let arrayBuffer = new ArrayBuffer(44 + bufferLength);
            let view = new DataView(arrayBuffer);

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + bufferLength, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(view, 36, 'data');
            view.setUint32(40, bufferLength, true);

            return Buffer.from(new Uint8Array(arrayBuffer));
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // Safe JSON Escaped Dispatcher to Prevent Backslash String Mismatch
        function sendToPremiere(targetPath) {
            var scriptCall = 'importSFXToTimeline(' + JSON.stringify(targetPath) + ')';
            csInterface.evalScript(scriptCall, function(res) {
                console.log("ExtendScript Response:", res);
            });
        }

        function addSoundToTimeline(filePath) {
            if (!filePath) return;

            if (chkReverse.checked && fs) {
                fs.readFile(filePath, (err, data) => {
                    if (err) return;
                    const arrayBuffer = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
                    audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
                        const reversedBuffer = audioCtx.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
                        for (let c = 0; c < buffer.numberOfChannels; c++) {
                            const srcData = buffer.getChannelData(c);
                            const destData = reversedBuffer.getChannelData(c);
                            for (let i = 0; i < buffer.length; i++) {
                                destData[i] = srcData[buffer.length - 1 - i];
                            }
                        }

                        const tempDir = os ? os.tmpdir() : '.';
                        const baseName = path ? path.basename(filePath, path.extname(filePath)) : 'reversed';
                        const tempPath = path ? path.join(tempDir, `${baseName}_reversed.wav`) : `${tempDir}/${baseName}_reversed.wav`;
                        
                        const wavNodeBuffer = bufferToWav(reversedBuffer);
                        fs.writeFileSync(tempPath, wavNodeBuffer);

                        sendToPremiere(tempPath);
                    });
                });
            } else {
                sendToPremiere(filePath);
            }
        }

        document.getElementById('btnAddToTimeline').onclick = () => {
            if (currentActivePath) addSoundToTimeline(currentActivePath);
        };

        function stopWebAudio() {
            if (currentBufferSource) {
                try { currentBufferSource.stop(); } catch(e){}
                currentBufferSource = null;
            }
            isPlayingWebAudio = false;
        }

        function playAudio(filePath, cardEl, startOffset = 0) {
            document.querySelectorAll('.file-item').forEach(c => c.classList.remove('selected'));
            if (cardEl) cardEl.classList.add('selected');

            currentActivePath = filePath;
            stopWebAudio();

            if (!fs) {
                audioEngine.src = filePath;
                audioEngine.currentTime = startOffset;
                audioEngine.play();
                playPauseBtn.innerText = '⏸';
                startSmoothPlayheadSync();
                return;
            }

            fs.readFile(filePath, (err, data) => {
                if (err) return;
                const arrayBuffer = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
                audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
                    if (chkReverse.checked) {
                        const reversedBuffer = audioCtx.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
                        for (let c = 0; c < buffer.numberOfChannels; c++) {
                            const srcData = buffer.getChannelData(c);
                            const destData = reversedBuffer.getChannelData(c);
                            for (let i = 0; i < buffer.length; i++) {
                                destData[i] = srcData[buffer.length - 1 - i];
                            }
                        }
                        activeAudioBuffer = reversedBuffer;
                        drawRealGrayWaveform();
                        totalTimeEl.innerText = formatTime(reversedBuffer.duration);
                        playWebAudioBuffer(startOffset);
                    } else {
                        activeAudioBuffer = buffer;
                        drawRealGrayWaveform();
                        totalTimeEl.innerText = formatTime(buffer.duration);
                        audioEngine.src = filePath;
                        audioEngine.currentTime = startOffset;
                        audioEngine.play();
                        playPauseBtn.innerText = '⏸';
                        startSmoothPlayheadSync();
                    }
                });
            });
        }

        function playWebAudioBuffer(offset = 0) {
            stopWebAudio();
            if (!activeAudioBuffer) return;

            currentBufferSource = audioCtx.createBufferSource();
            currentBufferSource.buffer = activeAudioBuffer;
            
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = volSlider.value;
            
            currentBufferSource.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            playbackStartTime = audioCtx.currentTime - offset;
            currentBufferSource.start(0, offset);
            isPlayingWebAudio = true;
            playPauseBtn.innerText = '⏸';

            startSmoothPlayheadSync();
        }

        function drawRealGrayWaveform() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const mid = canvas.height / 2;

            if (!activeAudioBuffer) {
                ctx.strokeStyle = '#333';
                ctx.beginPath();
                ctx.moveTo(0, mid);
                ctx.lineTo(canvas.width, mid);
                ctx.stroke();
                return;
            }

            const rawData = activeAudioBuffer.getChannelData(0);
            const samples = canvas.width;
            const blockSize = Math.floor(rawData.length / samples);

            ctx.fillStyle = '#888';
            for (let i = 0; i < samples; i++) {
                let sum = 0;
                for (let j = 0; j < blockSize; j++) {
                    sum += Math.abs(rawData[i * blockSize + j] || 0);
                }
                let avg = sum / blockSize;
                let barHeight = Math.max(2, avg * canvas.height * 2.5);
                ctx.fillRect(i, mid - barHeight / 2, 1, barHeight);
            }
        }

        function startSmoothPlayheadSync() {
            cancelAnimationFrame(animationFrameId);
            function update() {
                if (!isDraggingPlayhead) {
                    if (isPlayingWebAudio && activeAudioBuffer) {
                        currentOffset = audioCtx.currentTime - playbackStartTime;
                        if (currentOffset >= activeAudioBuffer.duration) {
                            stopWebAudio();
                            playPauseBtn.innerText = '▶';
                            playhead.style.left = '0%';
                            return;
                        }
                        const pct = (currentOffset / activeAudioBuffer.duration) * 100;
                        playhead.style.left = pct + '%';
                        currentTimeEl.innerText = formatTime(currentOffset);
                    } else if (audioEngine.duration) {
                        const pct = (audioEngine.currentTime / audioEngine.duration) * 100;
                        playhead.style.left = pct + '%';
                        currentTimeEl.innerText = formatTime(audioEngine.currentTime);
                    }
                }
                if (isPlayingWebAudio || !audioEngine.paused) {
                    animationFrameId = requestAnimationFrame(update);
                }
            }
            animationFrameId = requestAnimationFrame(update);
        }

        function updatePlayheadUI() {
            if (audioEngine.duration) {
                const pct = (audioEngine.currentTime / audioEngine.duration) * 100;
                playhead.style.left = pct + '%';
                currentTimeEl.innerText = formatTime(audioEngine.currentTime);
            }
        }

        function resizeCanvas() {
            canvas.width = waveformContainer.clientWidth;
            canvas.height = waveformContainer.clientHeight;
            drawRealGrayWaveform();
        }
        window.addEventListener('resize', resizeCanvas);

        function seek(e) {
            const rect = waveformContainer.getBoundingClientRect();
            let x = e.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            const percentage = x / rect.width;
            playhead.style.left = (percentage * 100) + '%';

            if (isPlayingWebAudio && activeAudioBuffer) {
                const targetOffset = percentage * activeAudioBuffer.duration;
                playWebAudioBuffer(targetOffset);
            } else if (audioEngine.duration) {
                audioEngine.currentTime = percentage * audioEngine.duration;
                currentTimeEl.innerText = formatTime(audioEngine.duration * percentage);
            }
        }

        waveformContainer.addEventListener('mousedown', (e) => { isDraggingPlayhead = true; seek(e); });
        window.addEventListener('mousemove', (e) => { if (isDraggingPlayhead) seek(e); });
        window.addEventListener('mouseup', () => { isResizing = false; isDraggingPlayhead = false; });

        playPauseBtn.onclick = togglePlayPause;

        document.getElementById('btnRestart').onclick = () => {
            if (chkReverse.checked && activeAudioBuffer) {
                playWebAudioBuffer(0);
            } else if (audioEngine.src) {
                audioEngine.currentTime = 0;
                audioEngine.play();
                playPauseBtn.innerText = '⏸';
                startSmoothPlayheadSync();
            }
        };

        volSlider.oninput = (e) => { audioEngine.volume = e.target.value; };

        audioEngine.onloadedmetadata = () => {
            totalTimeEl.innerText = formatTime(audioEngine.duration);
        };

        audioEngine.onended = () => {
            playPauseBtn.innerText = '▶';
            playhead.style.left = '0%';
        };

        function formatTime(sec) {
            if (isNaN(sec)) return "00:00:00:00";
            const date = new Date(sec * 1000);
            const mm = String(date.getUTCMinutes()).padStart(2, '0');
            const ss = String(date.getUTCSeconds()).padStart(2, '0');
            const ms = String(Math.floor(date.getUTCMilliseconds() / 10)).padStart(2, '0');
            return `00:${mm}:${ss}:${ms}`;
        }

        renderTree();
    </script>
</body>
